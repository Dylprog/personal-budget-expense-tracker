services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    environment:
      DATABASE_PATH: /app/data/budget_tracker.db
    volumes:
      - budget_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:5001
    depends_on:
      - backend

volumes:
  budget_data:
